<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>정보 수집 대시보드 · info</title>
<style>
 :root{
   --bg:#0f1420; --panel:#171d2b; --panel2:#131a28; --border:#26304a;
   --text:#e6ebf5; --muted:#8a97b5; --accent:#4c8dff; --accent2:#2b3a5c;
 }
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--text);
   font-family:"Segoe UI","Malgun Gothic",sans-serif;font-size:14px}
 header{position:sticky;top:0;z-index:10;background:var(--bg);
   border-bottom:1px solid var(--border);padding:12px 18px}
 .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
 h1{font-size:18px;margin:0;font-weight:700}
 .stat{color:var(--muted);font-size:12.5px}
 .spacer{flex:1}
 .search{background:var(--panel);border:1px solid var(--border);border-radius:8px;
   padding:8px 11px;color:var(--text);font-size:13.5px;min-width:200px}
 .search:focus{outline:none;border-color:var(--accent)}
 button.act{background:var(--accent);color:#fff;border:0;border-radius:8px;
   padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
 button.act:disabled{opacity:.5;cursor:default}
 .tabs{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
 .srcbar{display:flex;gap:10px;align-items:center;margin-top:11px}
 .srctgl{color:var(--accent);font-size:13px;cursor:pointer;user-select:none;white-space:nowrap}
 .srcsearch{padding:6px 10px;font-size:12.5px;min-width:160px}
 #srcs{max-height:180px;overflow:auto}
 .chip{background:var(--panel);border:1px solid var(--border);border-radius:20px;
   padding:6px 14px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
 .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
 .chip.rg{border-color:#3a5a8c}
 .rgtag{display:inline-block;background:#123020;color:#8fe3b0;border:1px solid #1e5c3a;border-radius:5px;
   padding:1px 6px;font-size:11px;margin-right:5px}
 .digest{margin-top:11px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px}
 .dsect{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
 .dchips{display:flex;gap:6px;flex-wrap:wrap;flex:1}
 .dchip{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:4px 12px;
   font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
 .dchip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
 .drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
 .dlabel{color:var(--muted);font-size:12.5px;padding-top:5px}
 .dval{color:var(--accent);font-weight:600;font-size:13px}
 .dcount{color:var(--muted);font-size:12.5px}
 .dout{width:100%;box-sizing:border-box;height:300px;background:var(--bg);border:1px solid var(--border);
   border-radius:8px;color:#d3dbeb;font-family:Consolas,monospace;font-size:12.5px;padding:11px;resize:vertical}
 .wrap{padding:14px 18px 60px}
 table{width:100%;border-collapse:collapse}
 thead th{position:sticky;top:0;text-align:left;color:var(--muted);font-weight:600;
   font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--bg)}
 tbody td{padding:9px 10px;border-bottom:1px solid #1d2536;vertical-align:top}
 tbody tr.row{cursor:pointer}
 tbody tr.row:hover{background:var(--panel2)}
 .c-date{white-space:nowrap;color:var(--muted);font-size:12.5px;width:120px}
 .c-title{font-weight:600;line-height:1.4}
 .c-src{white-space:nowrap}
 .badge{display:inline-block;background:var(--accent2);color:#cdddff;border-radius:6px;
   padding:2px 8px;font-size:11.5px;margin-right:6px}
 .c-author{white-space:nowrap;color:var(--muted);font-size:12.5px;width:110px}
 .c-view{white-space:nowrap;color:var(--muted);text-align:right;width:70px}
 .empty{color:var(--muted)}
 tr.detail td{background:var(--panel2);border-bottom:1px solid var(--border);padding:0}
 .body{padding:14px 18px;white-space:pre-wrap;line-height:1.65;color:#d3dbeb;
   max-height:340px;overflow:auto}
 .meta{color:var(--muted);font-size:12.5px;margin-bottom:10px}
 .meta a{color:var(--accent);text-decoration:none}
 .meta a:hover{text-decoration:underline}
 .more{display:block;margin:18px auto 0;background:var(--panel);border:1px solid var(--border);
   color:var(--text);border-radius:8px;padding:9px 22px;font-size:13px;cursor:pointer}
 .loading{color:var(--muted);text-align:center;padding:30px}
 .adminbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px;align-items:center}
 button.act.ghost{background:var(--panel);border:1px solid var(--border);color:var(--text)}
 .addmsg{font-size:12.5px;margin-top:7px;min-height:16px}
 .addmsg.ok{color:#8fe3b0} .addmsg.err{color:#ff9a9a}
 .manage{margin-top:10px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;
   max-height:420px;overflow:auto}
 .mctrl{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px 10px;position:sticky;top:0;
   background:var(--panel2);border-bottom:1px solid var(--border);z-index:1}
 .mctrl select.search{padding:6px 8px;font-size:12.5px}
 .manage table{width:100%} .manage td,.manage th{padding:7px 10px;font-size:12.5px}
 .manage th{color:var(--muted);text-align:left;border-bottom:1px solid var(--border)}
 .manage tr+tr td{border-top:1px solid #1d2536}
 .mini{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;
   padding:3px 9px;font-size:12px;cursor:pointer}
 .mini:hover{color:var(--text);border-color:var(--accent)}
 .mini.del:hover{color:#ff9a9a;border-color:#ff9a9a}
 .off{opacity:.45}
 .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:5px;margin-right:5px;vertical-align:middle}
 .tag.ev{background:#3a2a12;color:#ffcf8f;border:1px solid #6b4a1e}
 .tag.tp{background:#1a2c3f;color:#9fd0ff;border:1px solid #2b4a6c}
 .deadline{display:inline-block;font-size:11.5px;color:#ff9a9a;margin-left:7px;white-space:nowrap}
 .evbox{background:#12203a;border:1px solid #2b4a6c;border-radius:8px;padding:9px 12px;margin-bottom:11px;
   font-size:12.8px;color:#cfe0f5;line-height:1.7}
 @media(max-width:640px){
   .c-author,.c-view,thead .h-author,thead .h-view{display:none}
   .c-date{width:auto}
 }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>📡 정보 수집 대시보드</h1>
    <span class="stat" id="stat">불러오는 중…</span>
    <span class="spacer"></span>
    <input class="search" id="q" placeholder="제목·본문 검색"/>
    <button class="act" id="digestBtn">📰 일일글</button>
    <button class="act" id="refresh">새로고침</button>
    <button class="act" id="ingest">지금 수집</button>
  </div>
  <div class="digest" id="digestPanel" style="display:none">
    <div class="dsect"><span class="dlabel">지역</span><span id="dRegions" class="dchips"></span></div>
    <div class="dsect"><span class="dlabel">주제</span><span id="dTopics" class="dchips"></span></div>
    <div class="drow">
      <span class="dlabel">기간</span>
      <input type="date" id="dFrom" class="search"/><span class="dlabel">~</span><input type="date" id="dTo" class="search"/>
      <button class="act" id="dGen">생성</button>
      <button class="act ghost" id="dClear">삭제</button>
      <button class="act ghost" id="dCopy">복사</button>
      <span class="dcount" id="dCount"></span>
    </div>
    <textarea id="dOut" class="dout" placeholder="지역·주제(다중 선택 가능, 안 고르면 전체)와 기간을 정하고 '생성'을 누르세요. 여러 조합으로 다양한 게시글을 만들 수 있습니다. '삭제'는 선택을 초기화합니다." readonly></textarea>
  </div>
  <div class="tabs" id="regions"></div>
  <div class="tabs" id="cats"></div>
  <div class="tabs" id="orgtypes"></div>
  <div class="tabs" id="topics"></div>
  <div class="srcbar">
    <span class="srctgl" id="srcToggle">▸ 출처 선택</span>
    <input class="search srcsearch" id="srcSearch" placeholder="출처 검색" style="display:none"/>
  </div>
  <div class="tabs" id="srcs" style="display:none"></div>

  <div id="admin" style="display:none">
    <div class="adminbar">
      <input class="search" id="addInput" placeholder="블로그 ID 또는 주소 입력 (예: mltmkr · blog.naver.com/mltmkr · RSS주소)" style="flex:1;min-width:240px"/>
      <select class="search" id="addCat" style="min-width:96px"></select>
      <button class="act" id="addBtn">+ 추가</button>
      <button class="act ghost" id="manageBtn">소스 관리</button>
    </div>
    <div class="addmsg" id="addMsg"></div>
    <div class="manage" id="managePanel" style="display:none"></div>
  </div>
</header>

<div class="wrap">
  <table>
    <thead><tr>
      <th class="c-date">수집일</th>
      <th>제목</th>
      <th class="c-src">출처</th>
      <th class="h-author c-author">작성자</th>
      <th class="h-view c-view">조회수</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="loading" id="loading" style="display:none">불러오는 중…</div>
  <button class="more" id="more" style="display:none">더 보기</button>
</div>

<script>
const $ = s => document.querySelector(s);
let state = {category:"", source:"", topic:"", region:"", org_type:"", q:"", offset:0, limit:100, done:false};
let REGIONS = [], TOPICS = [];

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function loadMeta(){
  const [srcRes, stat] = await Promise.all([
    fetch('/api/sources').then(r=>r.json()),
    fetch('/api/stats').then(r=>r.json())
  ]);
  // 카테고리 칩
  CATS = srcRes.categories || [];
  const cats = ['전체', ...(srcRes.categories||[])];
  $('#cats').innerHTML = cats.map(c=>{
    const val = c==='전체'?'':c;
    return `<span class="chip ${state.category===val?'on':''}" data-cat="${esc(val)}">${esc(c)}</span>`;
  }).join('');
  REGIONS = srcRes.regions||[]; TOPICS = srcRes.topics||[];
  // 기관유형 칩
  const orgts = ['전체 유형', ...(srcRes.org_types||[])];
  $('#orgtypes').innerHTML = orgts.map(o=>{
    const val = o==='전체 유형'?'':o;
    return `<span class="chip ot ${state.org_type===val?'on':''}" data-org="${esc(val)}">${esc(o)}</span>`;
  }).join('');
  document.querySelectorAll('[data-org]').forEach(el=>el.onclick=()=>{state.org_type=el.dataset.org;reset();loadMeta();});
  // 지역 칩
  const regions = ['전체 지역', ...(srcRes.regions||[])];
  $('#regions').innerHTML = regions.map(rg=>{
    const val = rg==='전체 지역'?'':rg;
    return `<span class="chip rg ${state.region===val?'on':''}" data-region="${esc(val)}">${esc(rg)}</span>`;
  }).join('');
  document.querySelectorAll('[data-region]').forEach(el=>el.onclick=()=>{state.region=el.dataset.region;reset();loadMeta();});
  // 주제 칩
  const topics = ['전체 주제', ...(srcRes.topics||[])];
  $('#topics').innerHTML = topics.map(t=>{
    const val = t==='전체 주제'?'':t;
    return `<span class="chip tpc ${state.topic===val?'on':''}" data-topic="${esc(val)}">${esc(t)}</span>`;
  }).join('');
  document.querySelectorAll('[data-topic]').forEach(el=>el.onclick=()=>{state.topic=el.dataset.topic;reset();loadMeta();});
  // 소스 칩(접이식)
  const srcs = srcRes.sources||[];
  $('#srcs').innerHTML = '<span class="chip '+(state.source===''?'on':'')+'" data-src="">전체 출처</span>' +
    srcs.map(s=>`<span class="chip ${state.source===s.id?'on':''}" data-src="${esc(s.id)}">${esc(s.name)}</span>`).join('');
  document.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{state.category=el.dataset.cat;reset();loadMeta();});
  document.querySelectorAll('[data-src]').forEach(el=>el.onclick=()=>{state.source=el.dataset.src;reset();loadMeta();});
  // 접이식 토글 라벨: 선택된 출처가 있으면 표시
  const selName = state.source ? (srcs.find(s=>s.id===state.source)||{}).name : '';
  $('#srcToggle').textContent = (srcsOpen?'▾':'▸') + ` 출처 선택 (${srcs.length})` + (selName?` · ${selName}`:'');
  $('#srcs').style.display = srcsOpen ? 'flex' : 'none';
  $('#srcSearch').style.display = srcsOpen ? 'inline-block' : 'none';
  applySrcFilter();
  refreshStat(stat);
}

let srcsOpen = false;
function applySrcFilter(){
  const q = ($('#srcSearch').value||'').trim().toLowerCase();
  document.querySelectorAll('#srcs [data-src]').forEach(el=>{
    if(!el.dataset.src){ el.style.display=''; return; }  // '전체 출처'는 항상
    el.style.display = (!q || el.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
}
$('#srcToggle').onclick = ()=>{ srcsOpen=!srcsOpen;
  $('#srcs').style.display = srcsOpen?'flex':'none';
  $('#srcSearch').style.display = srcsOpen?'inline-block':'none';
  $('#srcToggle').textContent = ($('#srcToggle').textContent||'').replace(/^[▸▾]/, srcsOpen?'▾':'▸');
};
$('#srcSearch').addEventListener('input', applySrcFilter);

function refreshStat(s){
  $('#stat').textContent = `글 ${s.posts}건 · 출처 ${s.sources}곳` +
    (s.last_ingest? ` · 최근수집 ${s.last_ingest}`:'');
}

function reset(){ state.offset=0; state.done=false; $('#rows').innerHTML=''; load(); }

async function load(){
  $('#loading').style.display='block'; $('#more').style.display='none';
  const p = new URLSearchParams({q:state.q, category:state.category, source:state.source,
    topic:state.topic, region:state.region, org_type:state.org_type, limit:state.limit, offset:state.offset});
  const data = await fetch('/api/posts?'+p).then(r=>r.json());
  $('#loading').style.display='none';
  const tb = $('#rows');
  if(state.offset===0 && data.rows.length===0){
    tb.innerHTML = '<tr><td colspan="5" class="loading">표시할 글이 없습니다. “지금 수집”을 눌러보세요.</td></tr>';
    return;
  }
  for(const r of data.rows){
    const tr = document.createElement('tr');
    tr.className='row';
    const isEv = r.kind==='event';
    const topicTag = r.topic && r.topic!=='기타' ? `<span class="tag ${isEv?'ev':'tp'}">${esc(r.topic)}</span>` : '';
    const applyInfo = (isEv && r.apply_end_str) ? `<span class="deadline">~${esc(r.apply_end_str)} 마감</span>` : '';
    tr.innerHTML = `
      <td class="c-date">${esc(r.collected_str)}</td>
      <td class="c-title">${topicTag}${esc(r.title)||'<span class=empty>(제목없음)</span>'}${applyInfo}</td>
      <td class="c-src"><span class="rgtag">${esc(r.region2||r.region||'전국')}</span><span class="badge">${esc(r.category)||'-'}</span>${esc(r.source_name)}</td>
      <td class="c-author">${esc(r.author)||'<span class=empty>—</span>'}</td>
      <td class="c-view">${r.view_count!=null?r.view_count.toLocaleString():'<span class=empty>—</span>'}</td>`;
    const detail = document.createElement('tr');
    detail.className='detail'; detail.style.display='none';
    const evLines = [];
    if(r.apply_start_str||r.apply_end_str) evLines.push(`📝 신청 ${esc(r.apply_start_str||'')}${r.apply_end_str?' ~ '+esc(r.apply_end_str):''}`);
    if(r.event_start_str||r.event_end_str) evLines.push(`📅 행사 ${esc(r.event_start_str||'')}${r.event_end_str?' ~ '+esc(r.event_end_str):''}`);
    if(r.target_audience) evLines.push(`👥 대상 ${esc(r.target_audience)}`);
    if(r.location) evLines.push(`📍 ${esc(r.location)}`);
    const evBox = evLines.length ? `<div class="evbox">${evLines.join(' &nbsp;·&nbsp; ')}</div>` : '';
    detail.innerHTML = `<td colspan="5"><div class="body">
      <div class="meta">🗓 발행 ${esc(r.published_str)||'-'} · 수집 ${esc(r.collected_str)}
        ${r.topic&&r.topic!=='기타'?'· 주제 '+esc(r.topic):''}
        · <a href="${esc(r.url)}" target="_blank" rel="noopener">원문 보기 ↗</a></div>
      ${evBox}
      ${esc(r.content_text)||'<span class=empty>(본문 없음 — 원문 링크 참고)</span>'}
    </div></td>`;
    tr.onclick=()=>{detail.style.display = detail.style.display==='none'?'':'none';};
    tb.appendChild(tr); tb.appendChild(detail);
  }
  state.offset += data.rows.length;
  state.done = !data.has_more;
  $('#more').style.display = state.done?'none':'block';
}

$('#more').onclick = load;
// ── 일일 정보글 생성 (지역·주제 다중선택 + 기간) ──
let digestReady = false;
function buildDigestChips(){
  $('#dRegions').innerHTML = REGIONS.map(r=>`<span class="dchip" data-dreg="${esc(r)}">${esc(r)}</span>`).join('');
  $('#dTopics').innerHTML = TOPICS.map(t=>`<span class="dchip" data-dtop="${esc(t)}">${esc(t)}</span>`).join('');
  document.querySelectorAll('[data-dreg],[data-dtop]').forEach(el=>el.onclick=()=>el.classList.toggle('on'));
  // 메인에서 지역을 고른 상태면 그 지역을 기본 선택
  if(state.region){ const m=$(`[data-dreg="${CSS.escape(state.region)}"]`); if(m) m.classList.add('on'); }
  digestReady = true;
}
$('#digestBtn').onclick = ()=>{
  const p=$('#digestPanel');
  if(p.style.display==='none'){
    p.style.display='block';
    if(!digestReady) buildDigestChips();
    const today = new Date().toISOString().slice(0,10);
    if(!$('#dFrom').value) $('#dFrom').value = today;
    if(!$('#dTo').value) $('#dTo').value = today;
  } else { p.style.display='none'; }
};
$('#dGen').onclick = async ()=>{
  const b=$('#dGen'); b.disabled=true; b.textContent='생성 중…';
  const regs=[...document.querySelectorAll('[data-dreg].on')].map(e=>e.dataset.dreg).join(',');
  const tops=[...document.querySelectorAll('[data-dtop].on')].map(e=>e.dataset.dtop).join(',');
  const qp = new URLSearchParams({regions:regs, topics:tops, date_from:$('#dFrom').value, date_to:$('#dTo').value});
  try{
    const d = await fetch('/api/digest?'+qp).then(r=>r.json());
    $('#dOut').value = d.markdown || '';
    $('#dCount').textContent = `${d.region} · ${d.date} · ${d.count}건`;
  }catch(e){ $('#dOut').value = '생성 실패: '+e.message; }
  b.disabled=false; b.textContent='생성';
};
$('#dClear').onclick = ()=>{
  document.querySelectorAll('[data-dreg].on,[data-dtop].on').forEach(e=>e.classList.remove('on'));
  $('#dOut').value=''; $('#dCount').textContent='';
};
$('#dCopy').onclick = ()=>{
  const t=$('#dOut'); t.select(); document.execCommand('copy');
  const b=$('#dCopy'); b.textContent='복사됨!'; setTimeout(()=>b.textContent='복사',1200);
};
$('#refresh').onclick = ()=>{reset();fetch('/api/stats').then(r=>r.json()).then(refreshStat);};
$('#q').addEventListener('input', ()=>{clearTimeout(window._t);
  window._t=setTimeout(()=>{state.q=$('#q').value.trim();reset();},350);});
$('#ingest').onclick = async ()=>{
  const b=$('#ingest'); b.disabled=true; b.textContent='수집 중…';
  try{ await fetch('/api/ingest',{method:'POST'}); }catch(e){}
  b.disabled=false; b.textContent='지금 수집';
  reset(); fetch('/api/stats').then(r=>r.json()).then(refreshStat);
};

// ── 관리자: 블로그 추가 + 소스 관리 ──
let CATS = [];
async function initAdmin(){
  let me; try { me = await fetch('/api/admin/me').then(r=>r.json()); } catch(e){ return; }
  if(!me.admin) return;
  $('#admin').style.display='block';
  const cats = CATS.length?CATS:['정부','지자체','공공기관','교육','비영리','기타'];
  $('#addCat').innerHTML = cats.map(c=>`<option>${esc(c)}</option>`).join('');
  const catSel = $('#addCat'); if(cats.includes('기타')) catSel.value='기타';
}
function setMsg(t, ok){ const m=$('#addMsg'); m.textContent=t; m.className='addmsg '+(ok?'ok':'err'); }
async function addSource(){
  const val = $('#addInput').value.trim();
  if(!val){ setMsg('주소나 ID를 입력하세요.', false); return; }
  const b=$('#addBtn'); b.disabled=true; b.textContent='확인 중…'; setMsg('피드 확인 중…', true);
  try{
    const r = await fetch('/api/admin/add-source',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({input:val, category:$('#addCat').value})});
    const d = await r.json();
    if(!r.ok){ setMsg('❌ '+(d.error||'추가 실패'), false); }
    else{
      setMsg(`✅ "${d.name}" 추가됨 (${d.category}) · ${d.inserted}건 수집`, true);
      $('#addInput').value='';
      await loadMeta(); reset();
      if($('#managePanel').style.display!=='none') loadManage();
    }
  }catch(e){ setMsg('❌ 오류: '+e.message, false); }
  b.disabled=false; b.textContent='+ 추가';
}
let manageSources=[];
async function loadManage(){
  const p=$('#managePanel'); p.style.display='block'; p.innerHTML='<div class="loading">불러오는 중…</div>';
  await reloadManageData(true);
}
async function reloadManageData(buildControls){
  const d = await fetch('/api/admin/sources').then(r=>r.json());
  manageSources = d.sources||[];
  if(buildControls){
    const regions=[...new Set(manageSources.map(s=>s.region))];
    const orgs=[...new Set(manageSources.map(s=>s.org_type))];
    $('#managePanel').innerHTML = `
      <div class="mctrl">
        <input id="mSearch" class="search" placeholder="출처 검색" style="min-width:130px"/>
        <select id="mRegion" class="search"><option value="">지역 전체</option>${regions.map(r=>`<option>${esc(r)}</option>`).join('')}</select>
        <select id="mOrg" class="search"><option value="">유형 전체</option>${orgs.map(o=>`<option>${esc(o)}</option>`).join('')}</select>
        <button class="mini" id="mOn">✓ 켜기</button>
        <button class="mini" id="mOff">✕ 끄기</button>
        <span class="dcount" id="mCount"></span>
      </div>
      <div id="mTableWrap"></div>`;
    $('#mSearch').addEventListener('input', renderManage);
    $('#mRegion').onchange=renderManage; $('#mOrg').onchange=renderManage;
    $('#mOn').onclick=()=>bulkToggle(true); $('#mOff').onclick=()=>bulkToggle(false);
  }
  renderManage();
}
function renderManage(){
  const q=($('#mSearch').value||'').toLowerCase(), rg=$('#mRegion').value, og=$('#mOrg').value;
  const list=manageSources.filter(s=>(!q||s.name.toLowerCase().includes(q))&&(!rg||s.region===rg)&&(!og||s.org_type===og));
  const rows=list.map(s=>`<tr class="${s.enabled?'':'off'}">
    <td><input type="checkbox" class="mchk" value="${esc(s.id)}"></td>
    <td>${esc(s.name)}</td>
    <td><span class="rgtag">${esc(s.region)}</span></td>
    <td><span class="badge">${esc(s.org_type)}</span></td>
    <td style="color:var(--muted);font-size:11.5px">${esc(s.category)}·${esc(s.type)}</td>
    <td style="text-align:right">${s.posts.toLocaleString()}</td>
    <td style="color:var(--muted);font-size:11px;white-space:nowrap">${esc(s.last_str||'-')}</td>
    <td><button class="mini" data-tgl="${esc(s.id)}" data-en="${s.enabled?0:1}">${s.enabled?'끄기':'켜기'}</button></td>
    <td><button class="mini del" data-del="${esc(s.id)}" data-nm="${esc(s.name)}">삭제</button></td>
  </tr>`).join('');
  $('#mTableWrap').innerHTML=`<table><tr><th><input type="checkbox" id="mAll"/></th><th>출처</th><th>지역</th><th>유형</th><th>분류·방식</th><th style="text-align:right">글</th><th>최근수집</th><th></th><th></th></tr>${rows}</table>`;
  const onCnt=list.filter(s=>s.enabled).length;
  $('#mCount').textContent=`${list.length}곳(켜짐 ${onCnt}) · 전체 ${manageSources.length}곳`;
  $('#mAll').onclick=e=>document.querySelectorAll('.mchk').forEach(c=>c.checked=e.target.checked);
  document.querySelectorAll('#mTableWrap [data-tgl]').forEach(el=>el.onclick=async()=>{
    await fetch('/api/admin/toggle-source',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:el.dataset.tgl, enabled:el.dataset.en==='1'})});
    reloadManageData(false);
  });
  document.querySelectorAll('#mTableWrap [data-del]').forEach(el=>el.onclick=async()=>{
    if(!confirm(`"${el.dataset.nm}" 소스를 삭제합니다. 수집된 글도 함께 삭제됩니다.`)) return;
    await fetch('/api/admin/delete-source',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:el.dataset.del, purge:true})});
    await loadMeta(); reset(); reloadManageData(false);
  });
}
async function bulkToggle(enabled){
  const ids=[...document.querySelectorAll('.mchk:checked')].map(c=>c.value);
  if(!ids.length){ alert('먼저 소스를 체크하세요.'); return; }
  await fetch('/api/admin/bulk-toggle',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ids, enabled})});
  reloadManageData(false);
}
$('#addBtn').onclick = addSource;
$('#addInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addSource(); });
$('#manageBtn').onclick = ()=>{ const p=$('#managePanel'); if(p.style.display==='none'){ loadManage(); } else { p.style.display='none'; } };

loadMeta().then(()=>{ load(); initAdmin(); });
</script>
</body>
